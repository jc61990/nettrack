# /etc/nginx/conf.d/nettrack.conf
#
# NetTrack reverse proxy configuration.
# Adjust server_name and SSL certificate paths for your environment.

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name nettrack.yourcompany.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nettrack.yourcompany.com;

    # ── TLS ───────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/pki/tls/certs/nettrack.crt;
    ssl_certificate_key /etc/pki/tls/private/nettrack.key;

    # Modern TLS only
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()"      always;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/nettrack.access.log combined;
    error_log  /var/log/nginx/nettrack.error.log  warn;

    # ── Frontend static files ─────────────────────────────────────────────────
    root  /opt/nettrack/frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively, HTML never
        location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for SSE streaming (network scan live output)
        proxy_set_header  Connection       "";
        proxy_buffering   off;
        proxy_cache       off;
        proxy_read_timeout 300s;

        # Rate limit the login endpoint at nginx level as well
        location /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host            $host;
            proxy_set_header X-Real-IP       $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # ── Block access to sensitive paths ──────────────────────────────────────
    location ~ /\.(env|git|htaccess) {
        deny all;
        return 404;
    }
}

# ── Rate limit zone (defined in http block or nginx.conf) ─────────────────────
# Add this to your /etc/nginx/nginx.conf inside the http {} block if not present:
#
#   limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
